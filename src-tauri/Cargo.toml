[package]
name = "kuro-launcher"
version = "0.3.0"
description = "A third-party front door for Roblox"
authors = ["Mem"]
license = "MIT"
repository = "https://github.com/Wassuplol/kuro-launcher"
edition = "2021"
rust-version = "1.85"

[lib]
name = "kuro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10.6"
windows = { version = "0.61.3", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_WinTrust", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper"] }
ureq = { version = "3.2.1", default-features = false, features = ["native-tls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"

[dev-dependencies]
md-5 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
