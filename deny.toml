[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Permissive licences only. A copyleft dependency would have to be a deliberate
# decision recorded in this file, not a surprise in a lockfile update.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
