<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>KURO invite</title>
    <style>
      :root {
        --page: #0b0d10;
        --panel: #11141a;
        --raised: #171b22;
        --line: rgba(255, 255, 255, 0.09);
        --body: #e8eaee;
        --muted: #9aa3af;
        --gold: #d9b465;
        font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #141922 0%, var(--page) 60%);
        color: var(--body);
        padding: 28px;
      }

      main {
        width: 100%;
        max-width: 460px;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }

      .mark span:first-child {
        color: var(--body);
        letter-spacing: 0.3em;
        font-weight: 600;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }

      .head {
        padding: 18px 18px 16px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .by {
        margin: 6px 0 0;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--muted);
      }

      .facts {
        display: grid;
        grid-template-columns: 116px 1fr;
        gap: 1px;
        background: var(--line);
        border-top: 1px solid var(--line);
      }

      .fact {
        background: var(--panel);
        padding: 11px 18px;
      }

      .fact dt {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 4px;
      }

      .fact dd {
        margin: 0;
        font-family: "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace;
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        gap: 10px;
        padding: 14px 16px 16px;
      }

      a.button {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }

      a.primary {
        background: var(--gold);
        color: #16120a;
      }

      a.primary:hover {
        background: #e6c377;
      }

      a.secondary {
        background: var(--raised);
        color: var(--body);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      a.secondary:hover {
        border-color: rgba(255, 255, 255, 0.26);
      }

      .note {
        margin: 14px 2px 0;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--muted);
      }

      .note strong {
        color: var(--body);
        font-weight: 550;
      }

      .bad {
        color: #f0a4a4;
      }

      /* A phone is where a shared invite is opened most often. The uuid gets the full
         width there, and the two actions stop competing for it. */
      @media (max-width: 430px) {
        .facts {
          grid-template-columns: 1fr;
        }

        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span>KURO</span><span>INVITE</span></div>

      <section class="card">
        <div class="head">
          <h1 id="name">Reading the invite</h1>
          <p class="by" id="by">One moment.</p>
        </div>

        <dl class="facts">
          <div class="fact">
            <dt>Place</dt>
            <dd id="place">-</dd>
          </div>
          <div class="fact">
            <dt>Server</dt>
            <dd id="server">Any server</dd>
          </div>
        </dl>

        <div class="actions">
          <a class="button primary" id="open" href="#">Open in Roblox</a>
          <a class="button secondary" id="web" href="#">Open roblox.com</a>
        </div>
      </section>

      <p class="note" id="note">
        <strong>Open in Roblox</strong> hands this server to the app. The second link asks
        Roblox's website to start it instead, which is the fallback when the app does not
        answer.
      </p>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var place = (params.get("p") || "").replace(/[^0-9]/g, "");
        var server = (params.get("s") || "").replace(/[^a-zA-Z0-9-]/g, "");
        var name = (params.get("n") || "").slice(0, 80);

        var nameEl = document.getElementById("name");
        var byEl = document.getElementById("by");
        var placeEl = document.getElementById("place");
        var serverEl = document.getElementById("server");
        var openEl = document.getElementById("open");
        var webEl = document.getElementById("web");

        if (!place) {
          nameEl.textContent = "This invite has no place in it";
          nameEl.className = "bad";
          byEl.textContent = "A link needs ?p=<place id>. Nothing was launched.";
          openEl.style.opacity = "0.4";
          openEl.removeAttribute("href");
          webEl.removeAttribute("href");
          webEl.style.opacity = "0.4";
          return;
        }

        // The name comes from whoever sent the link: Roblox's public APIs refuse another
        // site's fetch, and a page that guessed at a game's name would be worse than one
        // that shows the place id it was given.
        nameEl.textContent = name || "Place " + place;
        byEl.textContent = server
          ? "One exact server, named in the link."
          : "Any server of this place.";

        placeEl.textContent = place;
        serverEl.textContent = server || "Any server";
        if (server) serverEl.title = server;

        var deep = "roblox://placeId=" + place + (server ? "&gameInstanceId=" + server : "");
        var web =
          "https://www.roblox.com/games/start?placeId=" +
          place +
          (server ? "&gameInstanceId=" + encodeURIComponent(server) : "");

        openEl.setAttribute("href", deep);
        webEl.setAttribute("href", web);
      })();
    </script>
  </body>
</html>
