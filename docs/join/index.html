<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>KURO invite</title>
    <style>
      :root {
        --page: #0b0d10;
        --panel: #11141a;
        --raised: #171b22;
        --line: rgba(255, 255, 255, 0.09);
        --body: #e8eaee;
        --muted: #9aa3af;
        --gold: #d9b465;
        font-family: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 0%, #141922 0%, var(--page) 60%);
        color: var(--body);
        padding: 28px;
      }

      main {
        width: 100%;
        max-width: 460px;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--muted);
      }

      .mark span:first-child {
        color: var(--body);
        letter-spacing: 0.3em;
        font-weight: 600;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }

      .head {
        display: flex;
        gap: 14px;
        padding: 16px;
        align-items: center;
      }

      .icon {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        background: var(--raised);
        flex: 0 0 auto;
        object-fit: cover;
      }

      .titles {
        min-width: 0;
      }

      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .by {
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--line);
        border-top: 1px solid var(--line);
      }

      .fact {
        background: var(--panel);
        padding: 12px 16px;
      }

      .fact dt {
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 4px;
      }

      .fact dd {
        margin: 0;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        gap: 10px;
        padding: 14px 16px 16px;
      }

      a.button {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 38px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }

      a.primary {
        background: var(--gold);
        color: #16120a;
      }

      a.secondary {
        background: var(--raised);
        color: var(--body);
        border: 1px solid var(--line);
      }

      .note {
        margin: 14px 2px 0;
        font-size: 11.5px;
        line-height: 1.65;
        color: var(--muted);
      }

      .note strong {
        color: var(--body);
        font-weight: 550;
      }

      .bad {
        color: #f0a4a4;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><span>KURO</span><span>INVITE</span></div>

      <section class="card">
        <div class="head">
          <img class="icon" id="icon" alt="" width="64" height="64" hidden />
          <div class="titles">
            <h1 id="name">Reading the invite</h1>
            <p class="by" id="by">One moment.</p>
          </div>
        </div>

        <dl class="facts">
          <div class="fact">
            <dt>Place</dt>
            <dd id="place">-</dd>
          </div>
          <div class="fact">
            <dt>Server</dt>
            <dd id="server">Any server</dd>
          </div>
        </dl>

        <div class="actions">
          <a class="button primary" id="open" href="#">Open in Roblox</a>
          <a class="button secondary" id="web" href="#">Open on roblox.com</a>
        </div>
      </section>

      <p class="note" id="note">
        The button hands this server to the Roblox app. If it does not open, the second
        link asks Roblox's website to start it instead.
      </p>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var place = (params.get("p") || "").replace(/[^0-9]/g, "");
        var server = (params.get("s") || "").replace(/[^a-zA-Z0-9-]/g, "");

        var nameEl = document.getElementById("name");
        var byEl = document.getElementById("by");
        var placeEl = document.getElementById("place");
        var serverEl = document.getElementById("server");
        var openEl = document.getElementById("open");
        var webEl = document.getElementById("web");
        var iconEl = document.getElementById("icon");
        var noteEl = document.getElementById("note");

        if (!place) {
          nameEl.textContent = "This invite has no place in it";
          nameEl.className = "bad";
          byEl.textContent = "A link needs ?p=<place id>. Nothing was launched.";
          openEl.style.opacity = "0.4";
          openEl.setAttribute("aria-disabled", "true");
          openEl.removeAttribute("href");
          webEl.removeAttribute("href");
          webEl.style.opacity = "0.4";
          return;
        }

        placeEl.textContent = place;
        serverEl.textContent = server ? server : "Any server";

        var deep = "roblox://placeId=" + place;
        if (server) deep += "&gameInstanceId=" + server;

        var web =
          "https://www.roblox.com/games/start?placeId=" +
          place +
          (server ? "&gameInstanceId=" + encodeURIComponent(server) : "");

        openEl.setAttribute("href", deep);
        webEl.setAttribute("href", web);

        // The card is decoration on top of a working link: if Roblox's public APIs are
        // unreachable, the buttons above already do the job and the page says so.
        function fail() {
          nameEl.textContent = "Place " + place;
          byEl.textContent = "Roblox did not answer with the game's details.";
          noteEl.innerHTML =
            "The link still works: <strong>Open in Roblox</strong> hands this server to the app.";
        }

        fetch("https://apis.roblox.com/universes/v1/places/" + place + "/universe")
          .then(function (r) {
            if (!r.ok) throw new Error("universe");
            return r.json();
          })
          .then(function (u) {
            var universe = u.universeId;
            if (!universe) throw new Error("universe");
            return fetch("https://games.roblox.com/v1/games?universeIds=" + universe)
              .then(function (r) {
                return r.json();
              })
              .then(function (g) {
                var game = (g.data || [])[0];
                if (!game) throw new Error("game");
                nameEl.textContent = game.name;
                var creator = game.creator && game.creator.name ? game.creator.name : "";
                byEl.textContent =
                  creator + (game.playing != null ? " · " + game.playing + " playing now" : "");
                return fetch(
                  "https://thumbnails.roblox.com/v1/games/icons?universeIds=" +
                    universe +
                    "&size=256x256&format=Png&isCircular=false",
                );
              })
              .then(function (r) {
                return r.json();
              })
              .then(function (t) {
                var icon = (t.data || [])[0];
                if (icon && icon.imageUrl) {
                  iconEl.src = icon.imageUrl;
                  iconEl.hidden = false;
                }
              });
          })
          .catch(fail);
      })();
    </script>
  </body>
</html>
