name: release

# A tag builds the installers and writes a **draft** release. Nothing is published
# by this workflow: a draft is a thing to look at and press Publish on, and a release
# that publishes itself is a release nobody checked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.2 (must match tauri.conf.json)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: installers (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # A release whose name and version disagree is the first thing a downloader
      # notices, so this fails here rather than after the build.
      - name: the tag has to match both version fields
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          fi
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag tauri.conf=$conf package.json=$pkg"
          if [ "${tag#v}" != "$conf" ]; then
            echo "::error::the tag $tag does not match the version $conf in tauri.conf.json"
            exit 1
          fi
          if [ "$conf" != "$pkg" ]; then
            echo "::error::tauri.conf.json says $conf and package.json says $pkg"
            exit 1
          fi

      - name: type check
        run: pnpm exec tsc --noEmit

      - name: tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The bundle product name must not contain an apostrophe. NSIS reads ' as a
      # string delimiter, so "Mem's Kuro Launcher" spilled the arguments of the next
      # macro and makensis failed with "NSISCOMCALL requires 4 parameter(s), passed 8"
      # on a script nobody wrote. The name is "Kuro Launcher" for that reason.
      - name: build the installers
        run: pnpm tauri build

      # GitHub rewrites a space in an asset name to a dot, so an installer called
      # "Kuro Launcher_0.1.0_x64-setup.exe" is served as
      # "Kuro.Launcher_0.1.0_x64-setup.exe". A checksum list naming the local file
      # then verifies against nothing a downloader has. Rename once, here, so the
      # sum sheet and the release agree byte for byte.
      - name: name the artifacts for the web
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          shopt -s nullglob
          for f in nsis/*.exe msi/*.msi; do
            base=$(basename "$f")
            if [[ "$base" == *" "* ]]; then
              mv "$f" "$(dirname "$f")/${base// /-}"
            fi
          done
          ls -la nsis msi

      # Bare file names, no directories: a sum sheet is checked next to the files
      # it names, in the folder the download landed in. The portable exe is listed
      # too, because the release notes tell people to trust this file.
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/target/release
          : > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          for f in bundle/nsis/*.exe bundle/msi/*.msi kuro-launcher.exe; do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$hash  $(basename "$f")" >> "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          done
          sort -k2 -o "$GITHUB_WORKSPACE/SHA256SUMS.txt" "$GITHUB_WORKSPACE/SHA256SUMS.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: kuro-launcher-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/kuro-launcher.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: KURO ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            Windows 10 and 11, x64.

            **Unsigned.** There is no code-signing certificate behind this build, so
            SmartScreen will warn the first time the installer runs. The SHA-256 of
            every file is in `SHA256SUMS.txt`: check it before running anything.

            What it does: your accounts, the Roblox clients on this machine, Fast Flags
            with a way back, discovery, the library, friends with live presence and a
            launch that lands where you pointed it. It never modifies the client, never
            touches Hyperion, and never sends a session anywhere except Roblox.

            The portable `kuro-launcher.exe` is the same build without an installer: put
            it in a folder, and a file named `portable` beside it keeps its data there.

            ## What is new in 0.2.0

            Sessions reads the client's own log and says what actually happened: the place,
            the server it reached, the GPU it picked, how long the join took and why it
            ended. On top of that: a playtime ledger that outlives log rotation, a graphics
            pin written for the exact client executable and re-applied when Roblox installs
            a new version folder, launch tiles, an always-on-top in-game strip, one flag
            catalogue kept per client version with a diff between any two, `kuro://` party
            links registered from Settings, and Discord presence (off by default, and it
            needs your own Discord application id before it shows anything).

            ## What is new in 0.2.1

            The in-game strip lost its square corners: the window is transparent now, so the
            card is the whole shape instead of a card inside a dark rectangle. Its ping is
            gone as well, because a TCP probe against a game port only ever measured the
            absence of a TCP service. It shows the client's own join time instead.

            Play time starts at the join line. A client that prewarms in the tray for three
            hours and plays for four minutes no longer banks three hours.

            Sessions and the launch panel can now copy a short invite link
            (`wassuplol.github.io/kuro-launcher/join/...`) that shows the game and the exact
            server before opening it, for people who do not have KURO installed.

            ## What is new in 0.2.2

            Robux, in two places that matter. The title bar shows what the account holds,
            read from Roblox with the session this launcher already keeps. Paid access
            shows on the tile and on the game page before anything starts, so the paywall
            is met in this window and not in the client.

            The window is used at its full width now. Pages of tiles fill it; pages of
            forms stay a readable column in the middle instead of hugging the left edge.

            Discord presence tells the truth. The card clears when the game closes, and a
            client that opened but never reached a server no longer claims it is joining
            one. A heartbeat re-sends the activity every 30 seconds, which also notices a
            Discord that restarted underneath it.

            ## What is new in 0.3.0

            The launcher Roblox's links open. `roblox://` and `roblox-player:` are the two
            schemes roblox.com hands Windows when somebody presses Play; turning this on in
            Settings points both at KURO, so that press lands here instead, with the account,
            the flag profile and the graphics pin this app already applies. The default is to
            start the game straight away, because a Play press is already a press.

            Roblox's launcher is not removed or modified. The command it owned is copied into
            the registry first, and "Give it back", or uninstalling, restores it byte for
            byte. Roblox re-registers its own handler on every client update, so the takeover
            is re-stated at each start and the Settings row says when that happened. A link
            this app cannot read is handed to Roblox's own handler rather than dropped, so a
            click always ends somewhere, and Studio's own schemes are never touched.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/kuro-launcher.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
